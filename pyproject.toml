[project]
name = "canary-stis"
version = "0.1.0"
description = "Pathway analysis and calibration harness for HIV prevention impact of POC STI diagnostics"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "sciris",
    "starsim",
    "stisim",
    "parsimmon",
]

[tool.uv]
package = false

[tool.uv.sources]
starsim   = { git = "ssh://git@github.com/starsimhub/starsim.git", tag = "v3.7.4" }
stisim    = { git = "ssh://git@github.com/starsimhub/stisim.git", tag = "v1.7.2" }
parsimmon = { git = "ssh://git@github.com/InstituteforDiseaseModeling/parsimmon.git" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
