n_agents: 10000
# end of 2040, so 2027-2040 are whole years
stop: 2041
horizon: [2027, 2040]
# every arm continues from one simulation per member and seed stopped at the start of this year
snapshot_year: 2027
# runs are seeded crc32("47-<member>-<k>") for k = 1..n_seeds, a member and seed's arms sharing it
seed_prefix: "47"
n_seeds: 10

cell_label: HPrev, mature
country: eswatini
# members.json holds 45's 30 members, selected on 2026 HIV prevalence at 15-49 within
# tolerance of target on 45's seed; the band is drawn on the prevalence figure
target: 0.25
tolerance: 0.03

# 45's baseline: Barker 2022's pooled acquisition risk ratios for women, in both sexes,
# transmission cofactors at stisim's 1.2, and ANC HIV testing and ANC syphilis screening off
baseline:
  connectors:
    hiv_ng: {rel_sus_hiv_ng: 2.81}
    hiv_ct: {rel_sus_hiv_ct: 1.49}
    hiv_tv: {rel_sus_hiv_tv: 1.54}
    hiv_syph: {rel_sus_hiv_syph: 1.67}
  anc: {start: .inf}

# notify: Alam 2010 median for STI notification in LMICs; attend: about half of
# notified contacts reach a testing door (partner notification synthesis)
pn: &pn
  notify_rates: {stable: 0.54, casual: 0.54}
  attendance_rates: {stable: 0.5, casual: 0.5}
pn_90: &pn_90
  notify_rates: {stable: 0.9, casual: 0.9}
  attendance_rates: {stable: 0.9, casual: 0.9}

# 45's arms: sim_pars overrides per arm, on top of the baseline
arms:
  soc: {}
  poc: {intv_year: 2027}
  poc_pn: {intv_year: 2027, pn: *pn}
  poc_pn_90: {intv_year: 2027, pn: *pn_90}
  poc_sti_prep: {intv_year: 2027, prep: {eligibility: dx, coverage: 0.30, dur_months: 3}}
  poc_sti_prep_u90_6m: {intv_year: 2027, prep: {eligibility: dx, coverage: 0.90, dur_months: 6}}
  poc_sti_prep_pn: {intv_year: 2027, prep: {eligibility: dx, coverage: 0.30, dur_months: 3}, pn: *pn}
  poc_anc:
    intv_year: 2027
    anc: {start: 2027}
    sti_screening: {include_men: false, acceptance: 1.0, anc_only: true}
  poc_anc_hiv_testing:
    intv_year: 2027
    anc: {start: 2027}
    sti_screening: {include_men: false, acceptance: 1.0}
  magic_cure: {magic_cure: {year: 2027}}
  magic_prep: {prep: {eligibility: infected, start: 2027, coverage: 1.0, dur_months: 3}}
  magic_prep_12m: {prep: {eligibility: infected, start: 2027, coverage: 1.0, dur_months: 12}}

# every arm's prevented fraction shares this arm's infections as denominator,
# so differences between arms add
comparator: soc
labels:
  poc: Point-of-care STI panel
  poc_pn: Panel + partner notification, 54% notified, 50% attend
  poc_pn_90: Panel + partner notification, 90% notified, 90% attend
  poc_sti_prep: Panel + PrEP on STI treatment, 30% uptake, 3 months
  poc_sti_prep_u90_6m: Panel + PrEP on STI treatment, 90% uptake, 6 months
  poc_sti_prep_pn: Panel + PrEP + notification, 30% uptake, 3 months
  poc_anc: Panel + ANC testing from 2027, panel at the ANC HIV test
  poc_anc_hiv_testing: Panel + ANC testing from 2027, panel at every HIV test
  magic_cure: "Magic cure: four STIs cleared in 2027"
  magic_prep: "Magic PrEP: everyone newly STI-infected starts PrEP, 3 months"
  magic_prep_12m: "Magic PrEP: everyone newly STI-infected starts PrEP, 12 months"

# pathway contributions as sums of arms' prevented fractions
components:
  - ["Direct treatment (panel against SOC)", {poc: 1}]
  - ["Partner notification, 54% notified, 50% attend", {poc_pn: 1, poc: -1}]
  - ["Partner notification, 90% notified, 90% attend", {poc_pn_90: 1, poc: -1}]
  - ["PrEP on STI treatment, 30% uptake, 3 months", {poc_sti_prep: 1, poc: -1}]
  - ["PrEP on STI treatment, 90% uptake, 6 months", {poc_sti_prep_u90_6m: 1, poc: -1}]
  - ["Notification x PrEP, 30% uptake, 3 months", {poc_sti_prep_pn: 1, poc_pn: -1, poc_sti_prep: -1, poc: 1}]
  - ["ANC HIV and syphilis testing, with the panel at ANC", {poc_anc: 1, poc: -1}]
  - ["Panel at every other HIV test", {poc_anc_hiv_testing: 1, poc_anc: -1}]
