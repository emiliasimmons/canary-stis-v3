n_agents: 10000

# HIV prevalence at ages 15-49 in 2026 that a country's draws land in
countries:
  eswatini: {target: 0.25}
  zimbabwe: {target: 0.15}
tolerance: 0.03

# draws leaving the middle risk group (1 - prop_x0 - prop_x2) below this, for
# either sex, are resampled
min_middle_group: 0.05

# draws per country in each stage. The batch is sized from the pilot's landing
# fractions so each country's mature cell gets about 30 landing draws (N ≈ 30 / p).
stages:
  pilot: {eswatini: 30, zimbabwe: 30}

ranges:
  prop_f0: [0.40, 0.94]
  prop_m0: [0.36, 0.88]
  prop_f2: [0.009, 0.11]
  prop_m2: [0.018, 0.22]
  f1_conc: [0.009, 0.17]
  f2_conc: [0.09, 0.28]
  m1_conc: [0.13, 0.22]
  hiv_beta_m2f: [0.003, 0.012]
  rel_init_prev: [0.1, 1.5]
  syph_beta_m2f: [0.01, 0.12]
  ng_beta_m2f: [0.019, 0.33]
  ct_beta_m2f: [0.03, 0.16]
  tv_beta_m2f: [0.005, 0.08]

# drawn uniformly in log space, so each order of magnitude gets a similar
# number of draws
log_ranges: [rel_init_prev]

# STIPS 2019, adults 18-49 in two Rakai communities: the span of the two
# communities' 95% CIs, in percent. The model's RPR-positive syphilis is set
# against STIPS's high-titre syphilis (RPR >= 1:8).
sti_bands:
  ct: [7.9, 12.0]
  ng: [3.8, 10.5]
  tv: [7.7, 14.5]
  syph_rpr: [0.8, 11.5]
