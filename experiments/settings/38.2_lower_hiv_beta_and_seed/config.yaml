n_agents: 10000

# HIV prevalence at ages 15-49 in 2026 that a country's draws land in
countries:
  eswatini: {target: 0.25}
  zimbabwe: {target: 0.15}
tolerance: 0.03

# draws leaving the middle risk group (1 - prop_x0 - prop_x2) below this, for
# either sex, are resampled
min_middle_group: 0.05

# draws per country in each stage. The batch is sized from the pilot's landing
# fractions (8 of 30 Eswatini draws, 3 of 30 Zimbabwe) so each country's mature
# cell gets about 30 landing draws (N ≈ 30 / p).
stages:
  pilot: {eswatini: 30, zimbabwe: 30}
  batch: {eswatini: 110, zimbabwe: 300}

ranges:
  prop_f0: [0.40, 0.94]
  prop_m0: [0.36, 0.88]
  prop_f2: [0.009, 0.11]
  prop_m2: [0.018, 0.22]
  f1_conc: [0.009, 0.17]
  f2_conc: [0.09, 0.28]
  m1_conc: [0.13, 0.22]
  hiv_beta_m2f: [0.003, 0.025]
  rel_init_prev: [0.01, 1.5]
  syph_beta_m2f: [0.097, 0.38]
  ng_beta_m2f: [0.019, 0.33]
  ct_beta_m2f: [0.046, 0.54]
  tv_beta_m2f: [0.019, 0.66]

# drawn uniformly in log space, so each order of magnitude gets a similar
# number of draws
log_ranges: [rel_init_prev]
