n_agents: 10000

# HIV prevalence at ages 15-49 in 2026 that a country's draws land in
countries:
  eswatini: {target: 0.25}
  zimbabwe: {target: 0.15}
tolerance: 0.03

# the mature cell's intervention year; the expanding cell's is each draw's peak year
mature_intv_year: 2027

# draws leaving the middle risk group (1 - prop_x0 - prop_x2) below this, for
# either sex, are resampled
min_middle_group: 0.05

stages:
  batch: {eswatini: 200}

# 38.3's ranges, with HIV beta_m2f moved up from 0.003-0.012 for Eswatini alone
ranges:
  prop_f0: [0.40, 0.94]
  prop_m0: [0.36, 0.88]
  prop_f2: [0.009, 0.11]
  prop_m2: [0.018, 0.22]
  f1_conc: [0.009, 0.17]
  f2_conc: [0.09, 0.28]
  m1_conc: [0.13, 0.22]
  hiv_beta_m2f: [0.010, 0.020]
  rel_init_prev: [0.3, 1.5]
  seed_year: [1993, 2000]
  syph_beta_m2f: [0.01, 0.12]
  ng_beta_m2f: [0.019, 0.33]
  ct_beta_m2f: [0.03, 0.16]
  tv_beta_m2f: [0.005, 0.08]
log_ranges: [rel_init_prev]

# where each country's candidate draws come from: this experiment's batch, or
# another experiment's results.jsonl, relative to this folder
candidates:
  eswatini: batch
  zimbabwe: ../38.3_seed_year_lower_sti_beta/outputs/results.jsonl

replicates:
  draws_per_country: 5
  seeds: 10
